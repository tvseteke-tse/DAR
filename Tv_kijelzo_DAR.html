<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Dél-Alföldi Amatőr Egyéni Tekeranglista Verseny - Élő Ranglista</title>
<style>
    * { box-sizing: border-box; }
    html, body { height: 100vh; margin: 0; padding: 0; overflow: hidden; }
    body { background-color: #00122e; color: #ffff00; padding: 6px; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; display: flex; flex-direction: column; }
    
    .board-container { 
        width: 100%; 
        height: 100%; 
        margin: 0 auto; 
        background: #001c47; 
        border: 2px solid #0044aa; 
        border-radius: 8px; 
        padding: 6px; 
        box-shadow: 0 0 25px rgba(0, 50, 150, 0.6); 
        display: flex; 
        flex-direction: column;
    }
    
    .category-tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 6px; flex-wrap: wrap; flex-shrink: 0; }
    .cat-tab { 
        background: #002b66; color: #ffffff; border: 1px solid #0044aa; padding: 4px 12px; 
        font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
    }
    .cat-tab.active { background: #0055ff; color: #ffff00; border-color: #ffff00; text-shadow: 0 0 5px rgba(255,255,0,0.5); box-shadow: 0 0 8px rgba(0,85,255,0.5); }

    h1 { text-align: center; margin: 0 0 6px 0; font-size: 1.4rem; color: #ffff00; letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 0 8px rgba(255, 255, 0, 0.4); flex-shrink: 0; }
    
    .tables-wrapper {
        display: flex;
        gap: 12px;
        flex: 1;
        overflow: hidden;
    }

    .table-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; font-family: 'Courier New', Courier, monospace; table-layout: fixed; }
    th { color: #ffff00; border-bottom: 2px solid #0044aa; padding: 4px 2px; font-size: 0.8rem; white-space: nowrap; }
    td { padding: 4px 2px; text-align: center; border-bottom: 1px solid #002b66; font-size: 0.88rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .rank-col { width: 36px; color: #ffffff; text-align: center; overflow: visible !important; text-overflow: clip !important; }
    .name-col { text-align: left; font-family: sans-serif; color: #ffff00; width: 140px; }
    .stat-col { color: #8b949e; font-size: 0.88rem; }
    
    .color-green { color: #00ff66 !important; text-shadow: 0 0 4px rgba(0, 255, 102, 0.4); }
    .color-yellow { color: #ffff00 !important; text-shadow: 0 0 4px rgba(255, 255, 0, 0.4); }
    .color-red { color: #ff3333 !important; text-shadow: 0 0 4px rgba(255, 51, 51, 0.4); }

    .total-col { font-weight: bold; font-size: 0.98rem; }
    tr.top3 { background-color: rgba(0, 68, 170, 0.4); }
    tr.top3 .rank-col { color: #ffff00; }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="board-container">
    <div class="category-tabs" id="tabsContainer"></div>

    <h1 id="boardTitle">Dél-Alföldi Amatőr Egyéni Tekeranglista Verseny.
